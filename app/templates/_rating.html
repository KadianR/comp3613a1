{% macro rating_stars(average, count) %}
<div class="rating-stars" aria-label="{{ ('%.1f out of 5 from %d review(s)'|format(average, count)) if average is not none else 'No reviews yet' }}">
  {% for position in range(1, 6) %}
  <span class="material-symbols-outlined rating-star {{ 'is-on' if average is not none and position <= (average + 0.5)|int }}" aria-hidden="true">star</span>
  {% endfor %}
  <span class="rating-label">
    {% if average is not none %}{{ '%.1f'|format(average) }} ({{ count }}){% else %}No reviews yet{% endif %}
  </span>
</div>
{% endmacro %}
